    <title>HTS - Global Ledger</title>
    <style>
        :root { 
            --neon-blue: #00d4ff; --neon-green: #39ff14; --bg-obsidian: #0a0a0a; 
            --neon-glow: rgba(0, 212, 255, 0.4);
        }
        .nav-bar { 
            width: 100%; background: #111; display: flex; justify-content: center; 
            gap: 25px; padding: 20px 0; border-bottom: 1px solid #1a1a1a; 
            position: sticky; top: 0; z-index: 1000;
        }
        .tab-link { 
            color: #444; font-weight: bold; font-size: 11px; text-decoration: none;
            letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .tab-link.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-glow); }
        body { background-color: var(--bg-obsidian); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; cursor: none; }
        body:hover, body:hover * { cursor: auto; }
        
        #projector-canvas { width: 100%; display: flex; flex-direction: column; align-items: center; transition: margin-bottom 0.2s; }
        
        /* HEADER UPDATED FOR LOGO */
        .header { 
            width: 100%; padding: 30px 0 30px 0; min-height: 170px; background: #0d0d0d; border-bottom: 2px solid #333; 
            text-align: center; position: relative;
        }
        .header h1 { color: var(--neon-blue); margin: 0; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; }
        


        .gmt-master { color: var(--neon-green); font-family: monospace; font-size: 20px; border: 1px solid var(--neon-green); padding: 5px 20px; display: inline-block; margin-top: 10px; }
        .abc-strip { display: flex; justify-content: center; flex-wrap: wrap; background: #000; padding: 15px; gap: 12px; width: 100%; position: sticky; top: 54px; z-index: 90; }
        .abc-key { color: var(--neon-blue); font-weight: bold; cursor: pointer; padding: 2px 5px; }
        .abc-key.active { color: var(--neon-green); border-bottom: 2px solid var(--neon-green); }
        .ledger-container { width: 90%; max-width: 1200px; padding: 40px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .country-card { background: #111; border-left: 5px solid var(--neon-blue); padding: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .country-card:hover { background: #1a1a1a; border-left-width: 10px; }
        .country-card.hidden { display: none; }
        .time-group { text-align: right; pointer-events: none; }
        .local-time-12 { color: var(--neon-green); font-family: monospace; font-size: 20px; font-weight: bold; }
        .local-time-24 { color: #555; font-family: monospace; font-size: 13px; }
        #tz-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #0d0d0d; border: 1px solid var(--neon-blue); padding: 40px; width: 80%; max-width: 800px; border-radius: 10px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 20px; right: 20px; color: #444; cursor: pointer; font-size: 24px; }
        .tz-row { border-bottom: 1px solid #222; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>

        function init() {
            const pos = localStorage.getItem('hts_curtain_pos') || 0;
            document.getElementById('projector-canvas').style.marginBottom = pos + 'px';
            const grid = document.getElementById('ledger-grid');
            const abc = document.getElementById('abc-strip');
            
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
                const btn = document.createElement('span');
                btn.innerText = l; btn.className = "abc-key";
                btn.onclick = (e) => {
                    document.querySelectorAll('.abc-key').forEach(k => k.classList.remove('active'));
                    e.target.classList.add('active');
                    document.querySelectorAll('.country-card').forEach(c => {
                        c.classList.toggle('hidden', l !== 'ALL' && c.dataset.letter !== l);
                    });
                };
                abc.appendChild(btn);
            });

            countryDB.sort((a,b) => a.n.localeCompare(b.n)).forEach((c, index) => {
                const card = document.createElement('div');
                card.className = 'country-card';
                card.dataset.letter = c.n.charAt(0).toUpperCase();
                card.onclick = () => openTZ(index);
                card.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span style="font-size:24px;">${c.f}</span> 
                        <span style="margin-left:10px; font-weight:bold;">${c.n}</span>
                    </div>
                    <div class="time-group">
                        <div class="local-time-12" data-offset="${c.o}">--:--</div>
                        <div class="local-time-24" data-offset="${c.o}">--:--</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            setInterval(tick, 1000);
            tick();
        }

        function openTZ(index) {
            const country = countryDB[index];
            const modal = document.getElementById('tz-modal');
            const list = document.getElementById('modal-tz-list');
            document.getElementById('modal-country-name').innerText = `${country.f} ${country.n.toUpperCase()}`;
            list.innerHTML = country.zones.map(z => `
                <div class="tz-row">
                    <div>
                        <div style="color: white; font-weight:bold;">${z.name} (GMT ${z.o >=0 ? '+'+z.o : z.o})</div>
                        <div class="city-list">${z.cities}</div>
                    </div>
                    <div style="color: var(--neon-green); font-family:monospace; font-weight:bold;">${calculateTime(z.o)}</div>
                </div>
            `).join('');
            modal.style.display = 'flex';
        }

        function closeTZ() { document.getElementById('tz-modal').style.display = 'none'; }

        function calculateTime(offset) {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const local = new Date(utc + (3600000 * offset));
            let hh = local.getHours();
            const mm = local.getMinutes().toString().padStart(2, '0');
            const suffix = hh >= 12 ? "PM" : "AM";
            hh = hh % 12 || 12;
            return `${hh}:${mm} ${suffix}`;
        }

        function tick() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            document.getElementById('gmt-readout').innerText = "GMT " + new Date(utc).toLocaleTimeString('en-GB', { hour12: false });
            document.querySelectorAll('.local-time-12').forEach(el => {
                const offset = parseFloat(el.dataset.offset);
                const local = new Date(utc + (3600000 * offset));
                let hh = local.getHours();
                const mm = local.getMinutes().toString().padStart(2, '0');
                const suffix = hh >= 12 ? "PM" : "AM";
                hh = hh % 12 || 12;
                el.innerHTML = `${hh}:${mm}<span style="font-size:10px; color:#444;">${suffix}</span>`;
            });
            document.querySelectorAll('.local-time-24').forEach(el => {
                const offset = parseFloat(el.dataset.offset);
                const local = new Date(utc + (3600000 * offset));
                el.innerText = `[ ${local.getHours().toString().padStart(2,'0')}:${local.getMinutes().toString().padStart(2,'0')} ]`;
            });
        }
        window.onload = init;
    </script>
