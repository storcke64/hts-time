<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS LCARS Console</title>
    <style>
        :root {
            --lcars-gold: #ff9900;
            --lcars-apricot: #ffcc99;
            --lcars-purple: #cc99cc;
            --lcars-blue: #99ccff;
            --lcars-pink: #cc6699;
            --lcars-red: #cc0000;
            --bg-black: #000000;
        }

        /* =========================================
           GLOBAL RESET & DOCTRINE 1 (ANCHOR)
           ========================================= */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background: transparent;
            display: block; /* FIX: flex+center shrinks body, poisoning 100vw in parent */
            overflow: hidden;
            font-family: sans-serif; /* LCARS uses clean sans-serif */
            user-select: none;
        }

        /* =========================================
           THE LCARS UNIT & DOCTRINE 2 (RIGID)
           ========================================= */
        .faceplate {
            width: 98%;
            height: 380px;
            background: var(--bg-black);
            border-radius: 0 0 40px 40px;
            position: relative;
            margin: 5px auto 0;
            display: flex;
            padding: 20px;
            gap: 15px;
            border-top: 4px solid var(--lcars-gold);
        }

        /* The iconic LCARS "Elbow" layout */
        .elbow-column {
            width: 150px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .elbow-top {
            height: 60px;
            background: var(--lcars-purple);
            border-radius: 20px 0 0 0;
            display: flex;
            align-items: center;
            padding-left: 20px;
            font-weight: bold;
            font-size: 14px;
            color: black;
        }

        .side-pill {
            height: 40px;
            background: var(--lcars-gold);
            border-radius: 20px 0 0 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            color: black;
            font-size: 11px;
            font-weight: bold;
        }

        /* =========================================
           ZONE 1: SENSOR READOUT (LCD)
           ========================================= */
        .zone-readout {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sensor-display {
            flex: 1;
            background: rgba(153, 204, 255, 0.05);
            border: 2px solid var(--lcars-blue);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-status { color: var(--lcars-blue); font-size: 28px; letter-spacing: 2px; }
        .sub-status { color: var(--lcars-apricot); font-size: 12px; font-family: monospace; margin-top: 5px; }

        .lcars-row { display: flex; gap: 8px; height: 45px; }
        .lcars-btn {
            flex: 1; border: none; cursor: pointer;
            font-weight: bold; font-size: 12px; color: black;
            text-transform: uppercase;
            transition: opacity 0.1s;
        }
        .lcars-btn:active { opacity: 0.5; }
        .lcars-btn.gold { background: var(--lcars-gold); border-radius: 0 0 0 0; }
        .lcars-btn.apricot { background: var(--lcars-apricot); border-radius: 0 0 0 0; }
        .lcars-btn.purple { background: var(--lcars-purple); border-radius: 0 20px 20px 0; }
        .lcars-btn.blue { background: var(--lcars-blue); border-radius: 20px 0 0 20px; }

        /* =========================================
           ZONE 2: DATA MANIFEST (List)
           ========================================= */
        .zone-manifest {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .manifest-list {
            flex: 1;
            overflow-y: auto;
            border-right: 8px solid var(--lcars-pink);
            padding-right: 10px;
        }

        .manifest-item {
            padding: 10px;
            margin-bottom: 5px;
            background: rgba(204, 102, 153, 0.1);
            color: var(--lcars-apricot);
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .manifest-item.active { background: var(--lcars-pink); color: black; font-weight: bold; }
        
        .eject-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .function-pill {
            height: 35px; border: none; border-radius: 17px;
            background: var(--lcars-blue); color: black;
            font-weight: bold; font-size: 10px; cursor: pointer;
        }
        .function-pill.saver { background: var(--lcars-purple); }
        .function-pill.red { background: var(--lcars-red); color: white; }

        /* Scrollbar */
        .manifest-list::-webkit-scrollbar { width: 5px; }
        .manifest-list::-webkit-scrollbar-thumb { background: var(--lcars-pink); }
    </style>
</head>
<body>

    <div class="faceplate">
        <div class="elbow-column">
            <div class="elbow-top">HTS-01</div>
            <div class="side-pill">NAV-COM</div>
            <div class="side-pill" style="background:var(--lcars-purple)">SYS-DATA</div>
            <div class="side-pill" style="background:var(--lcars-blue); height: 100%;">READY</div>
        </div>

        <div class="zone-readout">
            <div class="sensor-display">
                <div id="lcd-main" class="main-status">SYSTEM READY</div>
                <div id="lcd-sub" class="sub-status">AWAITING BRIDGE COMMAND</div>
            </div>
            
            <div class="lcars-row">
                <button class="lcars-btn blue" onclick="sendCmd('prev')">PREV</button>
                <button class="lcars-btn apricot" onclick="sendCmd('seek_bwd')">REW</button>
                <button class="lcars-btn gold" onclick="sendCmd('toggle')">ENGAGE</button>
                <button class="lcars-btn apricot" onclick="sendCmd('seek_fwd')">FWD</button>
                <button class="lcars-btn purple" onclick="sendCmd('next')">NEXT</button>
            </div>
        </div>

        <div class="zone-manifest">
            <div id="media-list" class="manifest-list"></div>
            
            <div class="eject-row">
                <button class="function-pill" onclick="sendCmd('import')">DATA LINK</button>
                <button class="function-pill red" onclick="sendCmd('doctor')">DIAGNOSTIC</button>
                <button class="function-pill saver" 
                        onmousedown="startSaverPress()" 
                        onmouseup="endSaverPress()" 
                        onmouseleave="abortSaverPress()">
                    SAVER
                </button>
                <button class="function-pill" onclick="sendCmd('toggle_settings')">SETTINGS</button>
            </div>
        </div>
    </div>

    <script>
        function sendCmd(a, d) { window.parent.postMessage({ type: 'HTS_CMD', action: a, data: d }, '*'); }
        
        let pressTimer, lockAction = false;
        function startSaverPress() { lockAction = false; pressTimer = setTimeout(() => { lockAction = true; sendCmd('open_saver_settings'); }, 800); }
        function endSaverPress() { clearTimeout(pressTimer); if (!lockAction) sendCmd('saver'); }
        function abortSaverPress() { clearTimeout(pressTimer); lockAction = true; }

        window.addEventListener('message', (e) => {
            const m = e.data;
            if (m.type === 'UPDATE_LCD') {
                document.getElementById('lcd-main').innerText = m.main;
                document.getElementById('lcd-sub').innerText = m.sub;
            }
            if (m.type === 'RENDER_LIST') { if (typeof renderList === 'function') renderList(m.pool, m.activeIdx); }
        });
    
    function renderList(pool, activeIdx) {
        var list = document.getElementById('media-list');
        if (!list || !pool) return;
        list.innerHTML = "";
        pool.forEach(function(item, i) {
            if (!item) return;
            var isFav = item.favorite === true;
            var el = document.createElement('div');
            el.className = 'manifest-item' + (i === activeIdx ? ' active' : '');
            el.style.cssText = "display:flex;align-items:center;gap:8px;";
            var dot = document.createElement('span');
            dot.style.cssText = "display:block;width:8px;height:8px;min-width:8px;border-radius:50%;flex-shrink:0;cursor:pointer;" + (isFav ? "background:#39ff14;box-shadow:0 0 5px #39ff14;" : "background:transparent;border:1px solid #555;");
            dot.onclick = (function(idx){ return function(ev){ ev.stopPropagation(); sendCmd('set_favorite', idx); }; })(i);
            var num = document.createElement('span');
            num.innerText = '0' + (i + 1);
            var name = document.createElement('span');
            name.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
            name.innerText = item.name.substring(0, 20);
            el.appendChild(dot); el.appendChild(num); el.appendChild(name);
            el.onclick = (function(idx){ return function(){ sendCmd('play_idx', idx); }; })(i);
            list.appendChild(el);
        });
    }

</script>
</body>
</html>
