<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Theme</title>
    <style>
        :root {
            --uni-pink: #ff9ff3;
            --uni-blue: #54a0ff;
            --uni-purple: #f368e0;
            --uni-yellow: #feca57;
            --uni-green: #55efc4;
            --uni-font: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        /* =========================================
           GLOBAL RESET
           ========================================= */
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background: transparent;
            
            display: block; /* FIX: flex+center shrinks body, poisoning 100vw in parent */
            overflow: hidden;
            font-family: var(--uni-font);
            user-select: none;
        }

        /* =========================================
           THE PHYSICAL UNIT
           ========================================= */
        .faceplate {
            width: 98%;
            height: 380px;
            background: linear-gradient(135deg, #fff0f6 0%, #eef2ff 100%);
            border: 4px solid white;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4), inset 0 0 30px white;
            position: relative;
            margin: 10px auto 0;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-end; 
            gap: 20px; 
            padding: 25px;
        }

        /* Rainbow Border */
        .faceplate::before {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--uni-pink), var(--uni-yellow), var(--uni-blue), var(--uni-purple));
            z-index: 10;
            border-radius: 20px 20px 0 0;
        }

        /* =========================================
           ZONE 1: MIRROR (Left)
           ========================================= */
        .zone-left {
            width: 500px; 
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .magic-mirror {
            background: #fff;
            border: 3px solid var(--uni-blue);
            border-radius: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(84, 160, 255, 0.2);
        }
        
        .mirror-text { color: var(--uni-purple); font-size: 22px; font-weight: bold; text-align: center; }
        .mirror-sub { color: #888; font-size: 12px; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .candy-row { display: flex; gap: 10px; height: 50px; }
        .candy-btn {
            flex: 1; border: none; border-radius: 25px;
            background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
            box-shadow: 0 4px 0 #ddd, 0 5px 10px rgba(0,0,0,0.1);
            color: #555; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .candy-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #ddd; }
        .candy-btn.play { background: linear-gradient(to bottom, var(--uni-pink) 0%, var(--uni-purple) 100%); color: white; box-shadow: 0 4px 0 #c445b0; }

        /* =========================================
           ZONE 2: LIST (Right)
           ========================================= */
        .zone-right {
            flex: 1;
            max-width: 450px;
            height: 100%;
            background: rgba(255,255,255,0.5);
            border-left: 2px dashed var(--uni-pink);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
        }

        .scroll-title { color: var(--uni-blue); font-weight: bold; font-size: 14px; text-align: center; margin-bottom: 10px; margin-top: 10px; }

        .scroll-list {
            flex: 1;
            overflow-y: auto;
            background: #fff; border-radius: 15px; border: 2px solid var(--uni-yellow);
            padding: 10px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }

        .scroll-item {
            padding: 8px; border-bottom: 1px solid #eee; color: #666; font-size: 12px;
            cursor: pointer; border-radius: 8px;
        }
        .scroll-item:hover { background: #fdf2f8; color: var(--uni-purple); }
        .scroll-item.active { background: var(--uni-pink); color: white; font-weight: bold; }
        .del-heart { float: right; color: #ff3131; cursor: pointer; opacity: 0.5; }

        .magic-actions { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; 
        }
        .magic-btn {
            padding: 10px; border-radius: 15px; border: 2px solid var(--uni-blue);
            background: white; color: var(--uni-blue); font-weight: bold; cursor: pointer;
            font-size: 11px;
        }
        .magic-btn:hover { background: var(--uni-blue); color: white; }
        .magic-btn.saver { border-color: var(--uni-green); color: #00b894; }
        .magic-btn.saver:hover { background: var(--uni-green); color: white; }
        .magic-btn.saver:active { transform: translateY(2px); }

        .sticker { position: absolute; font-size: 40px; opacity: 0.8; pointer-events: none; }
        .sticker.u1 { bottom: 10px; left: 10px; transform: rotate(-10deg); }
        .sticker.u2 { top: -25px; right: 20px; transform: rotate(10deg); z-index: 20; }

    </style>
</head>
<body>

    <div class="faceplate">
        <div class="sticker u1">🦄</div>
        <div class="sticker u2">✨</div>

        <div class="zone-left">
            <div class="magic-mirror">
                <div id="lcd-main" class="mirror-text">READY TO SPARKLE</div>
                <div id="lcd-sub" class="mirror-sub">Choose a video!</div>
            </div>

            <div class="candy-row">
                <button class="candy-btn" onclick="sendCmd('prev')">⏮</button>
                <button class="candy-btn" onclick="sendCmd('seek_bwd')">⏪</button>
                <button class="candy-btn play" onclick="sendCmd('toggle')">💖</button>
                <button class="candy-btn" onclick="sendCmd('seek_fwd')">⏩</button>
                <button class="candy-btn" onclick="sendCmd('next')">⏭</button>
            </div>
        </div>

        <div class="zone-right">
            <div class="scroll-title">My Magical Playlist</div>
            <div id="media-list" class="scroll-list"></div>

            <div class="magic-actions">
                <button class="magic-btn" onclick="sendCmd('import')">LOAD 📂</button>
                <button class="magic-btn" onclick="sendCmd('doctor')">DOCTOR 🏥</button>
                
                <button class="magic-btn saver"
                        onmousedown="startSaverPress()" 
                        onmouseup="endSaverPress()" 
                        onmouseleave="abortSaverPress()">
                    SAVER ✨
                </button>
                
                <button class="magic-btn" onclick="sendCmd('toggle_settings')">MENU ⚙️</button>
            </div>
             <div style="margin-top:5px; text-align:right;">
                <button class="magic-btn" style="width:100%; padding:5px; border-color:#ccc; color:#888;" onclick="sendCmd('fullscreen')">FULLSCREEN ⛶</button>
            </div>
        </div>
    </div>

    <script>
        function sendCmd(action, data) {
            window.parent.postMessage({ type: 'HTS_CMD', action: action, data: data }, '*');
        }

        let pressTimer;
        let lockAction = false; 

        function startSaverPress() {
            lockAction = false;
            pressTimer = setTimeout(() => {
                lockAction = true; 
                sendCmd('open_saver_settings'); 
            }, 800);
        }

        function endSaverPress() {
            clearTimeout(pressTimer); 
            if (!lockAction) {
                sendCmd('saver');
            }
        }
        
        function abortSaverPress() {
            clearTimeout(pressTimer);
            lockAction = true; 
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'UPDATE_LCD') {
                document.getElementById('lcd-main').innerText = event.data.main;
                document.getElementById('lcd-sub').innerText = event.data.sub;
            }

            if (event.data.type === 'RENDER_LIST') { if (typeof renderList === 'function') renderList(event.data.pool, event.data.activeIdx); }
        });
    
    function renderList(pool, activeIdx) {
        var list = document.getElementById('media-list');
        if (!list) return;
        list.innerHTML = "";
        if (!pool || pool.length === 0) {
            list.innerHTML = "<div style='text-align:center;padding:20px;color:#ccc;'>No Magic Yet...</div>";
            return;
        }
        pool.forEach(function(vid, i) {
            if (!vid) return;
            var isFav = vid.favorite === true;
            var item = document.createElement('div');
            item.className = 'scroll-item' + (i === activeIdx ? ' active' : '');
            item.style.cssText = "display:flex;align-items:center;gap:6px;";
            var dot = document.createElement('span');
            dot.style.cssText = "display:block;width:9px;height:9px;min-width:9px;border-radius:50%;flex-shrink:0;cursor:pointer;" + (isFav ? "background:#39ff14;box-shadow:0 0 6px #39ff14;" : "background:transparent;border:1px solid #888;");
            dot.onclick = (function(idx){ return function(ev){ ev.stopPropagation(); sendCmd('set_favorite', idx); }; })(i);
            var txt = document.createElement('span');
            txt.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
            txt.innerText = (isFav ? "⭐ " : "✨ ") + vid.name.substring(0, 15);
            var del = document.createElement('span');
            del.className = 'del-heart';
            del.innerText = "💔";
            del.onclick = (function(v){ return function(e){ e.stopPropagation(); if (!v.protected) sendCmd('delete_video', v.name); }; })(vid);
            item.appendChild(dot); item.appendChild(txt); item.appendChild(del);
            item.onclick = (function(idx){ return function(){ sendCmd('play_idx', idx); }; })(i);
            list.appendChild(item);
        });
    }

</script>
</body>
</html>
