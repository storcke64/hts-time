<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Industriaal Faceplate</title>
    <style>
        /* =========================================
           GLOBAL RESET
           ========================================= */
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background: transparent;
            
            display: block; /* FIX: flex+center shrinks body, poisoning 100vw in parent */
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* =========================================
           THE PHYSICAL UNIT
           ========================================= */
        .faceplate {
            width: 98%;
            height: 380px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            border: 2px solid #333;
            border-top: 2px solid #555;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 30px black, inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            margin: 10px auto 0;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            gap: 20px;
            padding: 25px;
        }

        /* Bolts */
        .bolt {
            position: absolute; width: 12px; height: 12px;
            background: #222; border-radius: 50%;
            border: 1px solid #111;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1), 0 1px 2px black;
            z-index: 5;
        }
        .bolt::after { content:""; position:absolute; top:5px; left:2px; width:8px; height:2px; background:#000; transform:rotate(45deg); }
        .bolt.tl { top: 10px; left: 10px; }
        .bolt.tr { top: 10px; right: 10px; }

        /* =========================================
           ZONE 1: LCD (Left)
           ========================================= */
        .zone-lcd {
            width: 500px;  
            height: 100%;  
            
            background: #080808;
            border-radius: 10px;
            border: 2px solid #222;
            box-shadow: inset 0 0 20px #000;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        
        .screen-glass {
            background: radial-gradient(circle, #001a00 0%, #000 100%);
            border: 1px solid #333;
            border-radius: 4px;
            flex: 1;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.05);
        }
        .screen-glass::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.5) 3px);
            pointer-events: none;
        }

        .lcd-text { color: #39ff14; font-family: monospace; font-size: 24px; font-weight: bold; text-shadow: 0 0 8px #39ff14; z-index: 2; }
        .lcd-sub { color: #1a8c1a; font-family: monospace; font-size: 11px; margin-top: 5px; z-index: 2; letter-spacing: 2px; }

        .bezel-buttons { display: flex; gap: 10px; height: 50px; }
        .hard-btn {
            flex: 1; background: linear-gradient(180deg, #333 0%, #222 100%);
            border: 1px solid #111; border-top: 1px solid #444; border-radius: 4px;
            color: #888; font-family: monospace; font-weight: bold; font-size: 14px;
            cursor: pointer; box-shadow: 0 4px 0 #111; transition: 0.1s;
        }
        .hard-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #111; }
        .hard-btn:hover { color: white; background: #444; }
        .hard-btn.play-btn { border-bottom: 3px solid #39ff14; color: #39ff14; }
        
        /* =========================================
           ZONE 2: CARTRIDGE (Right)
           ========================================= */
        .zone-cart {
            flex: 1;           
            max-width: 450px;  
            height: 100%;      
            
            background: #111;
            border-left: 2px solid #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 10px 0 20px -10px #000;
        }

        .panel-label {
            font-size: 9px; color: #444; letter-spacing: 2px; font-weight: bold; text-transform: uppercase;
            margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px;
        }

        .cart-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #222;
            background: #0a0a0a;
            padding: 5px;
            margin-bottom: 10px;
        }
        
        .cart-item {
            padding: 8px; font-family: monospace; font-size: 11px; color: #555;
            border-bottom: 1px dashed #222; cursor: pointer;
        }
        .cart-item:hover { color: #aaa; background: #151515; }
        .cart-item.active { color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        .del-x { float: right; color: #ff3131; font-weight: bold; opacity: 0; }
        .cart-item:hover .del-x { opacity: 1; }

        /* BUTTON GRID */
        .eject-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto;
        }
        .function-key {
            background: #222; border: 1px solid #333; color: #00d4ff;
            padding: 10px; font-size: 10px; font-weight: bold; cursor: pointer;
            text-align: center; border-radius: 4px; letter-spacing: 1px;
        }
        .function-key:hover { background: #00d4ff; color: black; box-shadow: 0 0 15px #00d4ff; }
        .function-key.alert { color: #ff3131; }
        .function-key.alert:hover { background: #ff3131; color: black; box-shadow: 0 0 15px #ff3131; }

        /* SAVER BUTTON */
        .function-key.saver { color: #39ff14; border-color: #39ff14; }
        .function-key.saver:hover { background: #39ff14; color: black; box-shadow: 0 0 15px #39ff14; }
        .function-key.saver:active { transform: translateY(2px); }

    </style>
</head>
<body>

    <div class="faceplate">
        <div class="bolt tl"></div>
        <div class="bolt tr"></div>

        <div class="zone-lcd">
            <div class="screen-glass">
                <div id="lcd-main" class="lcd-text">SYSTEM READY</div>
                <div id="lcd-sub" class="lcd-sub">AWAITING MEDIA</div>
            </div>
            
            <div class="bezel-buttons">
                <button class="hard-btn" onclick="sendCmd('prev')">|&lt;</button>
                <button class="hard-btn" onclick="sendCmd('seek_bwd')">&lt;&lt;</button>
                <button class="hard-btn play-btn" onclick="sendCmd('toggle')">PLAY</button>
                <button class="hard-btn" onclick="sendCmd('seek_fwd')">&gt;&gt;</button>
                <button class="hard-btn" onclick="sendCmd('next')">&gt;|</button>
            </div>
        </div>

        <div class="zone-cart">
            <div class="panel-label">DATA CARTRIDGE CONTENTS</div>
            <div id="media-list" class="cart-list">
            </div>
            
            <div class="eject-row">
                <button class="function-key" onclick="sendCmd('import')">LOAD DISK</button>
                <button class="function-key alert" onclick="sendCmd('doctor')">DOCTOR</button>
                
                <button class="function-key saver" 
                        onmousedown="startSaverPress()" 
                        onmouseup="endSaverPress()" 
                        onmouseleave="abortSaverPress()">
                    SCREENSAVER
                </button>
                
                <button class="function-key" style="border-color:#444; color:#666;" onclick="sendCmd('toggle_settings')">HUD / CONFIG</button>
            </div>
        </div>
    </div>

    <script>
        // === COMMUNICATION BRIDGE ===
        function sendCmd(action, data) {
            window.parent.postMessage({ type: 'HTS_CMD', action: action, data: data }, '*');
        }

        // === CLICK VS HOLD LOGIC (0.8s) ===
        let pressTimer;
        let lockAction = false; 

        function startSaverPress() {
            lockAction = false;
            pressTimer = setTimeout(() => {
                lockAction = true; 
                sendCmd('open_saver_settings'); 
            }, 800);
        }

        function endSaverPress() {
            clearTimeout(pressTimer); 
            if (!lockAction) {
                sendCmd('saver');
            }
        }
        
        function abortSaverPress() {
            clearTimeout(pressTimer); 
            lockAction = true; 
        }

        // === LISTENER ===
        window.addEventListener('message', (event) => {
            if (!event.data) return;

            if (event.data.type === 'UPDATE_LCD') {
                document.getElementById('lcd-main').innerText = event.data.main;
                document.getElementById('lcd-sub').innerText = event.data.sub;
            }

            if (event.data.type === 'RENDER_LIST') { if (typeof renderList === 'function') renderList(event.data.pool, event.data.activeIdx); }
        });
    
    function renderList(pool, activeIdx) {
        var list = document.getElementById('media-list');
        if (!list) return;
        list.innerHTML = "";
        if (!pool || pool.length === 0) {
            list.innerHTML = "<div style='padding:10px;color:#333;text-align:center;'>NO CARTRIDGE</div>";
            return;
        }
        pool.forEach(function(vid, i) {
            if (!vid) return;
            var isFav = vid.favorite === true;
            var item = document.createElement('div');
            item.className = 'cart-item' + (i === activeIdx ? ' active' : '');
            item.style.cssText = "display:flex;align-items:center;gap:6px;";
            var dot = document.createElement('span');
            dot.style.cssText = "display:block;width:9px;height:9px;min-width:9px;border-radius:50%;flex-shrink:0;cursor:pointer;" + (isFav ? "background:#39ff14;box-shadow:0 0 5px #39ff14;" : "background:transparent;border:1px solid #666;");
            dot.onclick = (function(idx){ return function(ev){ ev.stopPropagation(); sendCmd('set_favorite', idx); }; })(i);
            var nameSpan = document.createElement('span');
            nameSpan.style.cssText = "flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
            nameSpan.innerText = (i + 1) + ". " + vid.name.substring(0, 20);
            var delBtn = document.createElement('span');
            delBtn.className = 'del-x';
            delBtn.innerText = "x";
            delBtn.onclick = (function(v){ return function(e){ e.stopPropagation(); if (!v.protected) sendCmd('delete_video', v.name); }; })(vid);
            item.appendChild(dot); item.appendChild(nameSpan); item.appendChild(delBtn);
            item.onclick = (function(idx){ return function(){ sendCmd('play_idx', idx); }; })(i);
            list.appendChild(item);
        });
    }

</script>
</body>
</html>
