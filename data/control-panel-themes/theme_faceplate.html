<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS Faceplate HUD</title>
    <style>
        :root {
            --neon-blue: #00d4ff; --neon-green: #39ff14; --neon-red: #ff3131;
            --panel-border: rgba(176, 242, 255, 0.4);
            --screen-bg: #1a1c1a; --screen-text: #39ff14;
        }

        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            /* BODY IS NOW JUST DARK VOID */
            background-color: #050505; 
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: start;
        }

        .config-dashboard {
            width: fit-content; max-width: 950px; 
            
            /* --- FACEPLATE TEXTURE ZONE --- */
            background-color: #1a1c1a; 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            /* ------------------------------ */

            border: 2px solid var(--panel-border); border-radius: 8px;
            display: flex; padding: 20px; gap: 20px; 
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            margin-top: 30px;
            transition: background-image 0.5s ease-in-out;
        }

        /* TINT LAYER: Deepened to 50% to ensure the image doesn't wash out the UI */
        .config-dashboard::before {
            content: ""; position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            border-radius: 6px; 
            z-index: 0;
            pointer-events: none;
        }

        /* Ensure content sits ABOVE the tint layer */
        .cc-col, .bolt { z-index: 1; position: relative; }

        /* MECHANICAL BOLTS */
        .bolt { position: absolute; width: 8px; height: 8px; background: #333; border-radius: 50%; border: 1px solid #555; z-index: 2; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.2); }
        .tl { top: 5px; left: 5px; } .tr { top: 5px; right: 5px; } .bl { bottom: 5px; left: 5px; } .br { bottom: 5px; right: 5px; }

        .cc-col { display: flex; flex-direction: column; gap: 10px; }

        /* DARK FROSTED GLASS FOR VAULT SCROLLER */
        #vid-scroller { 
            flex: 1; overflow-y: auto; 
            background: rgba(0, 0, 0, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 4px; width: 300px; height: 100%;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .vid-row { height: 35px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; align-items: center; padding: 0 10px; transition: background 0.2s;}
        .vid-row:hover { background: rgba(255,255,255,0.05); }
        .vid-row.active { background: rgba(57, 255, 20, 0.15); border-left: 3px solid var(--neon-green); }
        .vid-name { font-family: monospace; font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vid-row.active .vid-name { color: white; font-weight: bold; }

        .cc-lcd {
            background: var(--screen-bg); color: var(--screen-text); 
            width: 500px; height: 80px; border-radius: 4px; 
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; border: 1px solid #333;
            box-shadow: inset 0 0 20px rgba(0,255,0,0.05); 
            text-transform: uppercase; margin-bottom: 10px;
        }
        #lcd-main { font-size: 20px; font-weight: bold; font-family: 'Courier New', monospace; text-shadow: 0 0 5px rgba(57, 255, 20, 0.3); }
        #lcd-sub { font-size: 10px; font-family: monospace; opacity: 0.7; }

        .control-row { display: flex; gap: 8px; width: 100%; height: 40px; }
        
        /* DARK FROSTED GLASS BUTTONS */
        .cc-btn { 
            background: rgba(0, 0, 0, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: #ddd; flex: 1; font-size: 10px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; text-transform: uppercase; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .cc-btn:hover { 
            border-color: var(--neon-blue); 
            color: white; 
            background: rgba(0, 212, 255, 0.2); 
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); 
        }
        .cc-btn:active { background: var(--neon-blue); color: black; }
        .cc-btn.exit { color: var(--neon-red); border-color: rgba(255, 49, 49, 0.4); }
        .cc-btn.exit:hover { background: rgba(255, 49, 49, 0.2); box-shadow: 0 0 10px rgba(255, 49, 49, 0.2); color: #fff; }
        
        .cc-sec-strip { display: flex; gap: 5px; margin-top: auto; }
    </style>
</head>
<body>

<div class="config-dashboard" id="faceplate-box">
    <div class="bolt tl"></div><div class="bolt tr"></div><div class="bolt bl"></div><div class="bolt br"></div>

    <div class="cc-col">
        <div style="font-size: 10px; color:#ddd; letter-spacing: 2px; font-weight:bold; text-shadow: 1px 1px 2px #000;">VAULT REPOSITORY</div>
        <div id="vid-scroller"></div>
        <div class="cc-sec-strip">
            <button id="plate-btn" class="cc-btn" onclick="sendCmd('open_plate_selector')">+ PLATE</button>
            <button class="cc-btn" style="border-color: var(--neon-blue); color: var(--neon-blue);" onclick="expandList()">EXPAND LIST</button>
        </div>
    </div>

    <div class="cc-col">
        <div class="cc-lcd">
            <div id="lcd-main">SYSTEM INITIALIZED</div>
            <div id="lcd-sub">READY FOR INPUT</div>
        </div>

        <div class="control-row">
            <button class="cc-btn" onclick="sendCmd('fullscreen')">FULL</button>
            <button class="cc-btn" onclick="sendCmd('prev')">PREV</button>
            <button class="cc-btn" onclick="sendCmd('seek_bwd')">BWD</button>
            <button class="cc-btn" style="flex:2; border-color: var(--neon-green);" onclick="sendCmd('toggle')">PLAY / PAUSE</button>
            <button class="cc-btn" onclick="sendCmd('seek_fwd')">FWD</button>
            <button class="cc-btn" onclick="sendCmd('next')">NEXT</button>
        </div>

        <div class="control-row">
            <button class="cc-btn" onclick="sendCmd('saver')">SAVER</button>
            <button class="cc-btn" onclick="sendCmd('doctor')">DOCTOR</button>
            <button class="cc-btn" onclick="sendCmd('delete')">DEL</button>
            <button class="cc-btn" style="border-color: #ffd700; color: #ffd700;" onclick="sendCmd('toggle_settings')">SETTINGS</button>
            <button class="cc-btn exit" onclick="sendCmd('exit')">EXIT</button>
        </div>
    </div>
</div>

<script>
    function sendCmd(action, payload) {
        window.parent.postMessage({ type: 'HTS_CMD', action: action, data: payload }, '*');
    }

    // INITIALIZATION: RESTORE SAVED FACEPLATE TO BOX ONLY
    window.onload = () => {
        const savedPlate = localStorage.getItem('hts_active_faceplate');
        if (savedPlate) {
            // Apply to BOX, not BODY
            document.getElementById('faceplate-box').style.backgroundImage = `url('${savedPlate}')`;
            const fileName = savedPlate.split('/').pop();
            document.getElementById('lcd-sub').innerText = `MOUNTED: ${fileName}`;
        }
    };

    window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || !msg.type) return;
        
        if (msg.type === 'SET_FACEPLATE') {
            const box = document.getElementById('faceplate-box');
            const sub = document.getElementById('lcd-sub');
            if (box) box.style.backgroundImage = `url('${msg.path}')`;
            const fileName = msg.filename || (msg.path ? msg.path.split('/').pop() : 'UNKNOWN');
            if (sub) sub.innerText = `MOUNTED: ${fileName}`;
            localStorage.setItem('hts_active_faceplate', msg.path);
        }

        if (msg.type === 'UPDATE_LCD') {
            const mainEl = document.getElementById('lcd-main');
            const subEl = document.getElementById('lcd-sub');
            if (mainEl) mainEl.innerText = msg.main || '';
            if (subEl) subEl.innerText = msg.sub || '';
        }
        if (msg.type === 'RENDER_LIST') { if (typeof renderList === 'function') renderList(msg.pool, msg.activeIdx); }
    });

    function renderList(pool, activeIdx) {
        const list = document.getElementById('vid-scroller');
        if (!list || !pool) return;
        list.innerHTML = "";
        pool.forEach(function(item, i) {
            if (!item) return;
            var isFav = item.favorite === true;
            var row = document.createElement('div');
            row.className = "vid-row" + (i === activeIdx ? " active" : "");
            row.style.cssText = "display:flex;align-items:center;gap:6px;padding:0 6px;box-sizing:border-box;";
            var dot = document.createElement('span');
            dot.style.cssText = "display:block;width:10px;height:10px;min-width:10px;border-radius:50%;flex-shrink:0;cursor:pointer;" + (isFav ? "background:#39ff14;box-shadow:0 0 6px #39ff14;" : "background:transparent;border:1px solid #555;");
            dot.onclick = (function(idx){ return function(ev){ ev.stopPropagation(); sendCmd('set_favorite', idx); }; })(i);
            var name = document.createElement('div');
            name.className = "vid-name";
            name.style.cssText = "flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
            name.innerText = item.name || 'UNKNOWN';
            row.appendChild(dot);
            row.appendChild(name);
            row.onclick = (function(idx){ return function(){ sendCmd('play_idx', idx); }; })(i);
            list.appendChild(row);
        });
    }

</script>
</body>
</html>
