<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="space"></canvas>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- CONFIG ---
        const ROCK_COUNT = 50;  // Fewer rocks, but higher quality
        const STAR_COUNT = 200;
        const SPEED = 8;        // Slower, more majestic speed
        const SPRITE_VARIANTS = 5; // How many unique rock shapes to create

        // --- STEP 1: THE "ASSET FACTORY" (Pre-render sprites) ---
        // We create invisible canvases to store our high-quality rock images
        const rockSprites = [];

        function generateSprites() {
            for(let i=0; i<SPRITE_VARIANTS; i++) {
                const sCanvas = document.createElement('canvas');
                const size = 200; // High resolution texture
                sCanvas.width = size;
                sCanvas.height = size;
                const sCtx = sCanvas.getContext('2d');
                
                // Center coordinate
                const cx = size/2;
                const cy = size/2;
                const r = size * 0.4;

                // 1. Draw the Base Shape (Jagged)
                sCtx.beginPath();
                let vertices = 10 + Math.random() * 5;
                for(let v=0; v<vertices; v++) {
                    let angle = (v / vertices) * Math.PI * 2;
                    let radius = r * (0.8 + Math.random() * 0.4);
                    let x = cx + Math.cos(angle) * radius;
                    let y = cy + Math.sin(angle) * radius;
                    if (v===0) sCtx.moveTo(x, y);
                    else sCtx.lineTo(x, y);
                }
                sCtx.closePath();
                
                // 2. Fill with Gradient (Simulated 3D Light)
                // Light comes from top-left
                let grad = sCtx.createRadialGradient(cx-r*0.3, cy-r*0.3, r*0.1, cx, cy, r);
                grad.addColorStop(0, '#707070'); // Highlight
                grad.addColorStop(0.5, '#303030'); // Midtone
                grad.addColorStop(1, '#050505');   // Shadow
                sCtx.fillStyle = grad;
                sCtx.fill();

                // 3. Add Craters (Details)
                for(let c=0; c<5; c++) {
                    let cr = Math.random() * r * 0.3;
                    let ca = Math.random() * Math.PI * 2;
                    let cd = Math.random() * r * 0.6;
                    let cX = cx + Math.cos(ca) * cd;
                    let cY = cy + Math.sin(ca) * cd;
                    
                    sCtx.beginPath();
                    sCtx.arc(cX, cY, cr, 0, Math.PI*2);
                    sCtx.fillStyle = 'rgba(0,0,0,0.3)'; // Crater shadow
                    sCtx.fill();
                }

                rockSprites.push(sCanvas);
            }
        }
        generateSprites(); // Run this ONCE at startup

        // --- STEP 2: THE OBJECTS ---
        
        const stars = [];
        for(let i=0; i<STAR_COUNT; i++) {
            stars.push({
                x: (Math.random() - 0.5) * width * 2,
                y: (Math.random() - 0.5) * height * 2,
                z: Math.random() * 2000,
                baseAlpha: Math.random() // Twinkle factor
            });
        }

        const rocks = [];
        for(let i=0; i<ROCK_COUNT; i++) {
            rocks.push({
                x: (Math.random() - 0.5) * width * 4,
                y: (Math.random() - 0.5) * height * 4,
                z: Math.random() * 3000 + 500,
                spriteIndex: Math.floor(Math.random() * SPRITE_VARIANTS),
                rotation: Math.random() * 6.28,
                rotSpeed: (Math.random() - 0.5) * 0.02
            });
        }

        // --- STEP 3: THE RENDER LOOP ---
        function animate() {
            // A. Cinematic Background (Dark Blue/Black gradient)
            let bg = ctx.createRadialGradient(width/2, height/2, width*0.2, width/2, height/2, width);
            bg.addColorStop(0, '#0a0a10'); // Center (Dark Blue)
            bg.addColorStop(1, '#000000'); // Edges (Pure Black)
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, width, height);

            // B. Draw Stars
            ctx.fillStyle = '#FFF';
            stars.forEach(s => {
                s.z -= SPEED * 0.2; // Move slowly
                if(s.z <= 0) s.z = 2000;
                
                let scale = 400 / s.z;
                let sx = width/2 + s.x * scale;
                let sy = height/2 + s.y * scale;
                
                if(sx > 0 && sx < width && sy > 0 && sy < height) {
                    let twinkle = Math.abs(Math.sin(Date.now() * 0.005 + s.baseAlpha));
                    ctx.globalAlpha = twinkle * (1 - s.z/2000);
                    ctx.fillRect(sx, sy, scale*2, scale*2);
                }
            });
            ctx.globalAlpha = 1;

            // C. Draw Rocks (Sorted)
            rocks.sort((a, b) => b.z - a.z); // Draw far ones first

            rocks.forEach(r => {
                r.z -= SPEED;
                r.rotation += r.rotSpeed;

                if(r.z <= 10) {
                    r.z = 3000;
                    r.x = (Math.random() - 0.5) * width * 4;
                    r.y = (Math.random() - 0.5) * height * 4;
                }

                let scale = 500 / r.z; // Perspective math
                let size = 200 * scale; // Base sprite size is 200px
                let sx = width/2 + r.x * scale;
                let sy = height/2 + r.y * scale;

                // Optimization: Don't draw if off screen
                if(size < 1 || sx < -size || sx > width+size || sy < -size || sy > height+size) return;

                // DRAW THE SPRITE
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(r.rotation);
                
                // Fog effect: Fade out distant rocks
                ctx.globalAlpha = Math.min(1, (3000 - r.z) / 1000); 
                
                // Draw Image (Fast!) instead of drawing paths (Slow)
                // We draw centered (-size/2)
                ctx.drawImage(rockSprites[r.spriteIndex], -size/2, -size/2, size, size);
                
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        // Resize
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        animate();

    </script>
</body>
</html>
